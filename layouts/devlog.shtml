<extend template="base.shtml">
<head id="head">
	<style>
	</style>
</head>
<main id="body">
	<h1 class="title">
		<ctx :text="$page.title"></ctx>
		at Ashet Technologies
	</h1>
	<div :html="$page.contentSection('about')"></div>
	<div class="feed" :loop="$page.contentSections().slice(1)">
		<div id="$loop.it.id">
			<h2><a href="$loop.it.id.prefix('#')">
				<span :text="$loop.it.id.parseDate().format('2nd January 2006')"></span>:
				<ctx :html="$loop.it.heading()"></ctx>
			</a></h2>

			<ctx :html="$loop.it.htmlNoHeading()"></ctx>
		</div>
	</div>
</main>
